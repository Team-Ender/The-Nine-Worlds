[workspace]
resolver = "2"
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
# Game engine
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "bevy_winit",
    "multi_threaded",
    "x11",
    "wayland",
] }
bevy_ecs = "0.20.1"

# Math
glam = "0.30"

# Physics
oxijolt = "1"

# Assets
gltf = "1.4"
image = "0.25"

# UI
egui = "0.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.10"
serde_json = "1.0"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"

