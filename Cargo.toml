[workspace]
resolver = "2"
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
# Graphics and windowing
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
glam = "0.30"
shaderc = "0.9"
bytemuck = { version = "1", features = ["derive"] }

# ECS and gameplay
bevy_ecs = "0.17"

# Physics
oxijolt = "1"

# Audio
kira = "0.10"

# Assets
gltf = "1.4"
image = "0.25"

# UI
egui = "0.31"

# Serialization
serde = { version = "1", features = ["derive"] }
ron = "0.10"
serde_json = "1"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
